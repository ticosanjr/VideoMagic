name: Windows portable build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI dependencies and build
        working-directory: ui
        run: npm ci; npm run build
      - name: Python dependencies
        run: uv sync --extra dev --group dev
      - name: Build Windows executable
        run: uv run python scripts/build_portable.py --fetch-ffmpeg --with-silero
      - name: Smoke test Windows executable
        shell: pwsh
        run: |
          .\dist\videoflow.exe version
          .\dist\videoflow.exe doctor
          .\dist\videoflow.exe mcp --help
      - name: Build tokenless Windows GPU worker kit
        run: |
          uv run python scripts/build_windows_kit.py --output dist
          uv run python -c "import zipfile,pathlib; p=next(pathlib.Path('dist').glob('VideoFlow-Windows-GPU-Worker-*.zip')); z=zipfile.ZipFile(p); names=set(z.namelist()); assert 'worker.env' not in names; assert any(n.startswith('wheels/videoflow_gpu_worker-') for n in names); assert 'VideoFlowGPU.ps1' in names; print(p, len(names), 'files')"
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: videoflow-windows
          path: |
            dist/videoflow.exe
            dist/VideoFlow-Windows-GPU-Worker-*.zip
            dist/windows-kit.json
          if-no-files-found: error
