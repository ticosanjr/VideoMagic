name: portable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: videoflow-linux-x86_64
          - os: windows-latest
            artifact: videoflow-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI dependencies
        working-directory: ui
        run: npm ci

      - name: UI build
        working-directory: ui
        run: npm run build

      - name: Python dependencies
        run: uv sync --extra dev

      - name: Build onefile with static FFmpeg
        run: uv run python scripts/build_portable.py --fetch-ffmpeg

      - name: Smoke (version, doctor, demo)
        run: |
          uv run python -c "import pathlib, subprocess; exe=next(p for p in [pathlib.Path('dist/videoflow'), pathlib.Path('dist/videoflow.exe')] if p.exists()); [subprocess.run([str(exe), cmd], check=True) for cmd in ['version', 'doctor']]; subprocess.run([str(exe), 'demo', '-o', 'demo-out'], check=True)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/videoflow
            dist/videoflow.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/videoflow*
          fail_on_unmatched_files: false
          overwrite_files: true
