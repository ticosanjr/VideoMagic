name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install static FFmpeg
        run: |
          curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ffmpeg.tar.xz
          mkdir -p /tmp/ffmpeg-static
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components=1
          sudo install /tmp/ffmpeg-static/ffmpeg /usr/local/bin/ffmpeg
          sudo install /tmp/ffmpeg-static/ffprobe /usr/local/bin/ffprobe
          ffmpeg -version | head -1
      - name: Python dependencies
        run: uv sync --extra dev --group dev
      - name: Python lint
        run: uv run ruff check src tests scripts
      - name: Python tests
        run: uv run pytest -q
      - name: Python media tests
        run: uv run pytest -q -m media --no-cov
      - name: UI dependencies
        working-directory: ui
        run: npm ci
      - name: UI checks
        working-directory: ui
        run: npm run check && npm test -- --run
      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: UI E2E
        working-directory: ui
        run: npm run test:e2e
      - name: UI build
        working-directory: ui
        run: npm run build
      - name: SBOM
        run: uv run python scripts/generate_sbom.py --output dist/sbom.json
