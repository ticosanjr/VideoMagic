name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install static FFmpeg
        run: |
          curl --retry 3 --retry-delay 5 -fsSL             https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz             -o /tmp/ffmpeg.tar.xz
          mkdir -p /tmp/ffmpeg-static
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components=2
          found_ffmpeg=$(find /tmp/ffmpeg-static -name ffmpeg -type f | head -1)
          found_ffprobe=$(find /tmp/ffmpeg-static -name ffprobe -type f | head -1)
          test -n "$found_ffmpeg"
          test -n "$found_ffprobe"
          sudo install "$found_ffmpeg" /usr/local/bin/ffmpeg
          sudo install "$found_ffprobe" /usr/local/bin/ffprobe
          ffmpeg -version | head -1
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q drawtext
      - name: Python dependencies
        run: uv sync --extra dev --group dev --extra tray --extra faster-whisper
      - name: Install OpenCV test dependency
        run: uv pip install opencv-python-headless
      - name: Python lint
        run: uv run ruff check src tests scripts
      - name: Python tests
        run: uv run pytest -q
      - name: Python media tests
        run: uv run pytest -q -m media --no-cov
      - name: UI dependencies
        working-directory: ui
        run: npm ci
      - name: UI checks
        working-directory: ui
        run: npm run check && npm test -- --run
      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: UI E2E
        working-directory: ui
        run: npm run test:e2e
      - name: UI build
        working-directory: ui
        run: npm run build
      - name: SBOM
        run: uv run python scripts/generate_sbom.py --output dist/sbom.json

  windows-unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Python dependencies
        run: uv sync --extra dev --group dev --extra tray
      - name: Install OpenCV test dependency
        run: uv pip install opencv-python-headless
      - name: Python unit tests
        run: uv run pytest tests/unit -q
