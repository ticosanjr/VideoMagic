name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install static FFmpeg
        run: |
          set -euo pipefail
          mkdir -p /tmp/ffmpeg-static
          strip=1
          if ! curl --retry 3 --retry-delay 5 -fsSL \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
              -o /tmp/ffmpeg.tar.xz; then
            rm -f /tmp/ffmpeg.tar.xz
          fi
          if [ ! -f /tmp/ffmpeg.tar.xz ] || ! tar -tJf /tmp/ffmpeg.tar.xz >/dev/null 2>&1; then
            echo "Primary FFmpeg mirror unavailable; using BtbN."
            curl --retry 3 --retry-delay 5 -fsSL \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              -o /tmp/ffmpeg.tar.xz
            strip=2
          fi
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components=$strip
          found_ffmpeg=$(find /tmp/ffmpeg-static -name ffmpeg -type f | head -1)
          found_ffprobe=$(find /tmp/ffmpeg-static -name ffprobe -type f | head -1)
          test -n "$found_ffmpeg"
          test -n "$found_ffprobe"
          sudo install "$found_ffmpeg" /usr/local/bin/ffmpeg
          sudo install "$found_ffprobe" /usr/local/bin/ffprobe
      - name: UI dependencies and build
        working-directory: ui
        run: npm ci && npm run build
      - name: Python dependencies
        run: uv sync --extra dev --group dev --extra faster-whisper --extra tray
      - name: Build worker wheels
        run: uv run python scripts/build_worker_wheels.py
      - name: Build Linux executable
        run: uv run python scripts/build_portable.py --with-ffmpeg --with-whisper --with-silero --with-faster-whisper --with-tray
      - name: Build AppImage
        run: uv run python scripts/build_appimage.py
      - name: Generate SBOM
        run: uv run python scripts/generate_sbom.py --output dist/sbom.json
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: videoflow-linux
          path: |
            dist/videoflow
            dist/VideoFlow-*-x86_64.AppImage
          if-no-files-found: error
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: videoflow-sbom
          path: dist/sbom.json
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI dependencies and build
        working-directory: ui
        run: npm ci; npm run build
      - name: Python dependencies
        run: uv sync --extra dev --group dev --extra tray
      - name: Build worker wheels
        run: uv run python scripts/build_worker_wheels.py
      - name: Build Windows executable
        run: uv run python scripts/build_portable.py --fetch-ffmpeg --with-silero --with-tray
      - name: Smoke test Windows executable
        shell: pwsh
        run: |
          $exe = ".\dist\videoflow.exe"
          & $exe version
          & $exe doctor
          & $exe mcp --help

          $port = 18765
          $proc = Start-Process -FilePath $exe `
            -ArgumentList @("serve", "--mcp-only", "--port", $port) -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:$port/health" -TimeoutSec 2
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) { throw "serve did not become ready on port $port" }
            if ($health.service -ne "videoflow") { throw "unexpected health payload" }
            & $exe status
            & $exe stop
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Build tokenless Windows GPU worker kit
        run: uv run python scripts/build_windows_kit.py --output dist
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: videoflow-windows
          path: |
            dist/videoflow.exe
            dist/VideoFlow-Windows-GPU-Worker-*.zip
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp artifacts/videoflow-linux/videoflow dist/videoflow
          cp artifacts/videoflow-linux/VideoFlow-*-x86_64.AppImage "dist/VideoFlow-${VERSION}-x86_64.AppImage"
          cp artifacts/videoflow-windows/videoflow.exe dist/videoflow.exe
          cp artifacts/videoflow-windows/VideoFlow-Windows-GPU-Worker-*.zip dist/
          cp artifacts/videoflow-sbom/sbom.json dist/sbom.json
          uv sync --extra dev --group dev
          uv run python scripts/release.py --version "$VERSION" --force \
            --artifact "$(ls dist/VideoFlow-Windows-GPU-Worker-*.zip)"
          gh release create "$GITHUB_REF_NAME" \
            "releases/v${VERSION}/videoflow-${VERSION}-linux-x86_64" \
            "releases/v${VERSION}/VideoFlow-${VERSION}-x86_64.AppImage" \
            "releases/v${VERSION}/videoflow-${VERSION}-windows-x86_64.exe" \
            "releases/v${VERSION}/VideoFlow-Windows-GPU-Worker-${VERSION}.zip" \
            "releases/v${VERSION}/sbom.json" \
            "releases/v${VERSION}/SHA256SUMS" \
            --title "VideoFlow ${VERSION}" \
            --notes-file "releases/v${VERSION}/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
