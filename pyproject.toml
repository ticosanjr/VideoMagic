[project]
name = "videoflow"
version = "0.32.0"
description = "Local, non-destructive video pre-edit pipeline with a rack UI and MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License not yet chosen" }
authors = [{ name = "VideoFlow" }]
keywords = ["video", "fcpxml", "mcp", "editing", "whisper"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "mcp>=1.20",
  "numpy>=1.26",
  "onnxruntime>=1.20",
  "opentimelineio>=0.18.1",
  "pydantic>=2.6",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100",
  "httpx>=0.27",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]
faster-whisper = [
    "av>=11,<19",
    "faster-whisper==1.2.1",
]

[project.scripts]
videoflow = "videoflow.cli:main"
videoflow-api = "videoflow.api.cli:main"
videoflow-mcp = "videoflow.mcp_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
  "-m",
  "not media and not slow and not manual and not packaging",
  "--cov=videoflow.domain",
  "--cov=videoflow.application.cache",
  "--cov=videoflow.application.timeline_builder",
  "--cov-report=term-missing",
  "--cov-fail-under=95",
]
markers = [
  "contract: public contract that the scaffold has not implemented yet",
  "media: requires FFmpeg and generated media",
  "slow: performance or long-media check",
  "manual: human NLE import or listening check",
  "packaging: builds and smoke-tests a staged AppImage or executable",
]

[tool.coverage.run]
branch = true
source = ["videoflow"]
omit = [
  "*/modules/*",
  "*/adapters/*",
  "*/exporters/*",
  "*/mcp_server/*",
  "*/api/*",
  "*/application/ports.py",
  "*/application/runner.py",
  "*/application/jobs.py",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = [
  "src/videoflow/domain",
  "src/videoflow/application/cache.py",
]
warn_unused_ignores = true
disallow_any_generics = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
]
