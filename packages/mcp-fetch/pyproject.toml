[project]
name = "videoflow-mcp-fetch"
version = "2.91.6"
description = "VideoFlow stock B-roll, image, SFX, and segment-fetch MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License not yet chosen" }
authors = [{ name = "VideoFlow" }]
keywords = ["video", "mcp", "broll", "stock", "sfx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]
dependencies = [
  "httpx>=0.27",
  "mcp>=1.20",
  "pydantic>=2.6",
  "vf-contracts",
]

[project.scripts]
videoflow-mcp-fetch = "mcp_fetch.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_fetch"]

[tool.uv.sources]
vf-contracts = { path = "../vf-contracts", editable = true }

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
