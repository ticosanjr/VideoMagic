[project]
name = "videoflow-mcp-vision"
version = "2.91.3"
description = "VideoFlow 2.90 vision MCP tools: captions, mattes, upscale, motion graphics, B-roll."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License not yet chosen" }
dependencies = [
  "mcp>=1.20",
  "vf-compute",
  "vf-contracts",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
videoflow-mcp-vision = "videoflow_mcp_vision.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoflow_mcp_vision"]

[tool.uv.sources]
vf-contracts = { path = "../vf-contracts", editable = true }
vf-compute = { path = "../vf-compute", editable = true }
