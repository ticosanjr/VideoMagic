[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "videoflow-gpu-worker"
version = "2.91.2"
description = "Isolated GPU inference worker for VideoFlow 2.90."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License not yet chosen" }
authors = [{ name = "VideoFlow" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pydantic>=2",
  "python-multipart>=0.0.20",
]

[project.scripts]
videoflow-gpu-worker = "gpu_worker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_worker"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
