[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "videoflow-scene-rules"
version = "3.16.0"
description = "Portable scene classification and editing-hint rules for VideoFlow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License not yet chosen" }
authors = [{ name = "VideoFlow" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/scene_rules"]
