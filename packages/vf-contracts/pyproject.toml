[project]
name = "vf-contracts"
version = "2.91.8"
description = "Workspace and asset contracts for VideoFlow 2.90."
requires-python = ">=3.11"
license = { text = "License not yet chosen" }
dependencies = ["pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vf_contracts"]
