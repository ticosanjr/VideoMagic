[project]
name = "vf-compute"
version = "3.0.1"
description = "Compute placement contracts and GPU worker client for VideoFlow 2.90."
requires-python = ">=3.11"
license = { text = "License not yet chosen" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vf_compute"]
