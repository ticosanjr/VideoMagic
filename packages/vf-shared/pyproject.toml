[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vf-shared"
version = "4.2.0"
description = "Shared contracts, compute routing, and scene rules for VideoFlow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License not yet chosen" }
authors = [{ name = "VideoFlow" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vf_shared"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
